[project]
name = "sitra-viewer-api"
version = "0.1.0"
description = "API for the SITRA Vietnam Conflict Data Explorer"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.165.0",
    "mgrs==1.7.1",
    "neo4j==6.4.1",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=60"
